spring:
  application:
    name: ms-account-reservation

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    show-sql: ${JPA_SHOW_SQL}
    open-in-view: false

  liquibase:
    change-log: db/changelog/db.changelog-master.xml

  cloud:
    openfeign:
      client:
        config:
          currency-client:
            connect-timeout: 3000
            read-timeout: 3000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      repositories:
        enabled: false

management:
  server:
    port: ${SERVER_PORT}
  endpoints:
    web:
      exposure:
        include: health, threaddump, prometheus

server:
  servlet:
    context-path: ${API_PREFIX}

app:
  currency-client:
    base-url: ${CURRENCY_BASE_URL}
    api-key: ${CURRENCY_API_KEY}
    enabled: ${CURRENCY_ENABLED}
    health-check-enabled: ${CURRENCY_HEALTH_CHECK_ENABLED}
    retry:
      max-attempts: ${CURRENCY_RETRY_MAX_ATTEMPTS}
      delay: ${CURRENCY_RETRY_DELAY}
      multiplier: ${CURRENCY_RETRY_MULTIPLIER}
    cache:
      ttl-minutes: ${CACHE_TTL_MINUTES}
