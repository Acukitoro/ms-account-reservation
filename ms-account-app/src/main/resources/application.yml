spring:
  application:
    name: ms-account-reservation

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    show-sql: ${JPA_SHOW_SQL}
    open-in-view: false

  liquibase:
    change-log: db/changelog/db.changelog-master.xml

management:
  server:
    port: ${SERVER_PORT}
  endpoints:
    web:
      exposure:
        include: health, threaddump

server:
  servlet:
    context-path: ${API_PREFIX}

app:
  currency-client:
    base-url: ${CURRENCY_BASE_URL:https://api.exchangerate.host}
    api-key: ${CURRENCY_API_KEY}